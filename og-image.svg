<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#060809"/>
      <stop offset="100%" style="stop-color:#0c1018"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff87"/>
      <stop offset="100%" style="stop-color:#00d4ff"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff87;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#00ff87;stop-opacity:0"/>
    </linearGradient>
    <!-- Grid pattern -->
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#00ff87" stroke-width="0.3" opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Grid texture -->
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Top glow -->
  <ellipse cx="600" cy="-40" rx="600" ry="300" fill="url(#glowGrad)"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="4" height="630" fill="url(#greenGrad)"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#greenGrad)" opacity="0.6"/>

  <!-- AI badge -->
  <rect x="80" y="80" width="64" height="28" rx="4" fill="none" stroke="#00ff87" stroke-width="1.5" opacity="0.5"/>
  <text x="112" y="99" font-family="monospace" font-size="11" fill="#00ff87" text-anchor="middle" letter-spacing="2">AI</text>

  <!-- Main title -->
  <text x="80" y="200" font-family="Georgia, serif" font-size="108" font-weight="900" fill="white" letter-spacing="4">LINE</text>
  <text x="80" y="310" font-family="Georgia, serif" font-size="108" font-weight="900" fill="url(#greenGrad)" letter-spacing="4">SCOUT</text>

  <!-- Subtitle -->
  <text x="80" y="370" font-family="monospace" font-size="18" fill="#4a5060" letter-spacing="3">MLB BETTING INTELLIGENCE</text>

  <!-- Divider line -->
  <rect x="80" y="400" width="500" height="1" fill="#1a2030"/>

  <!-- Feature pills -->
  <rect x="80" y="425" width="160" height="34" rx="17" fill="rgba(0,255,135,0.08)" stroke="rgba(0,255,135,0.3)" stroke-width="1"/>
  <text x="160" y="447" font-family="monospace" font-size="11" fill="#00ff87" text-anchor="middle" letter-spacing="1">RUN LINE VALUE</text>

  <rect x="254" y="425" width="140" height="34" rx="17" fill="rgba(0,212,255,0.08)" stroke="rgba(0,212,255,0.3)" stroke-width="1"/>
  <text x="324" y="447" font-family="monospace" font-size="11" fill="#00d4ff" text-anchor="middle" letter-spacing="1">LIVE WEATHER</text>

  <rect x="408" y="425" width="120" height="34" rx="17" fill="rgba(255,71,87,0.08)" stroke="rgba(255,71,87,0.3)" stroke-width="1"/>
  <text x="468" y="447" font-family="monospace" font-size="11" fill="#ff4757" text-anchor="middle" letter-spacing="1">HOT STREAKS</text>

  <!-- Books label -->
  <text x="80" y="520" font-family="monospace" font-size="13" fill="#252d38" letter-spacing="2">DRAFTKINGS · FANDUEL · BETMGM · CAESARS</text>

  <!-- URL -->
  <text x="80" y="570" font-family="monospace" font-size="16" fill="#2a3540" letter-spacing="1">linescoutai.com</text>

  <!-- Right side graphic - stylized card -->
  <rect x="780" y="100" width="340" height="420" rx="12" fill="rgba(0,255,135,0.03)" stroke="rgba(0,255,135,0.15)" stroke-width="1"/>
  <rect x="780" y="100" width="340" height="3" rx="2" fill="url(#greenGrad)"/>
  
  <!-- Card content -->
  <text x="810" y="145" font-family="monospace" font-size="10" fill="#3a4050" letter-spacing="2">RUN LINE VALUE</text>
  <rect x="810" y="155" width="90" height="20" rx="3" fill="#00ff87"/>
  <text x="855" y="169" font-family="monospace" font-size="9" fill="#060809" text-anchor="middle" letter-spacing="1">RUN LINE VALUE</text>

  <text x="810" y="210" font-family="monospace" font-size="10" fill="#3a4050" letter-spacing="1">NEW YORK YANKEES</text>
  <text x="810" y="230" font-family="monospace" font-size="9" fill="#252d38">vs Milwaukee Brewers</text>

  <!-- Odds grid -->
  <text x="810" y="275" font-family="monospace" font-size="9" fill="#3a4050" letter-spacing="1">MONEYLINE</text>
  <text x="810" y="295" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#666">-146</text>

  <text x="920" y="275" font-family="monospace" font-size="9" fill="#3a4050" letter-spacing="1">-1.5 RUN LINE</text>
  <text x="920" y="295" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#00ff87">+120</text>

  <text x="810" y="340" font-family="monospace" font-size="9" fill="#3a4050" letter-spacing="1">STREAK</text>
  <text x="810" y="360" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#ff4757">W5</text>

  <text x="920" y="340" font-family="monospace" font-size="9" fill="#3a4050" letter-spacing="1">WIN%</text>
  <text x="920" y="360" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#666">59%</text>

  <!-- Analysis text -->
  <rect x="810" y="385" width="280" height="110" rx="6" fill="rgba(255,255,255,0.02)"/>
  <text x="825" y="408" font-family="monospace" font-size="10" fill="#3a4050">Yankees are ML favorite at -146</text>
  <text x="825" y="425" font-family="monospace" font-size="10" fill="#3a4050">but run line sits at +120 — strong</text>
  <text x="825" y="442" font-family="monospace" font-size="10" fill="#3a4050">value on a team riding a W5 streak.</text>
  <text x="825" y="459" font-family="monospace" font-size="10" fill="#3a4050">Hammer the run line.</text>
</svg>
